[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wagtail-localize-intentional-blanks"
version = "0.3.0"
description = "Allow translators to mark wagtail-localize segments as 'do not translate'"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Lincoln Loop, LLC", email = "info@lincolnloop.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Framework :: Wagtail",
    "Framework :: Wagtail :: 7",
    "Framework :: Wagtail :: 8",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Internationalization",
]
dependencies = [
    "Django>=5.2",
    "wagtail>=7.0",
    "wagtail-localize>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-django>=4.5",
    "pytest-cov>=4.0",
    "selenium>=4.0",
    "pillow>=10.0",
    "black>=23.0",
    "flake8>=6.0",
    "isort>=5.12",
    "mypy>=1.0",
    # Pin ruff exactly, to be specific about which lint rules are used
    "ruff==0.15.5",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]

[project.urls]
Homepage = "https://github.com/lincolnloop/wagtail-localize-intentional-blanks"
Documentation = "https://github.com/lincolnloop/wagtail-localize-intentional-blanks"
Repository = "https://github.com/lincolnloop/wagtail-localize-intentional-blanks"
"Bug Tracker" = "https://github.com/lincolnloop/wagtail-localize-intentional-blanks/issues"

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
include = ["wagtail_localize_intentional_blanks*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
wagtail_localize_intentional_blanks = [
    "locale/**/*.po",
    "locale/**/*.mo",
    "templates/**/*.html",
    "static/**/*",
]

# The supported framework matrix. `hatch run test:cov` runs every combination
# locally; CI filters it to one interpreter per job with `+py=`. This is the
# only place the matrix is defined. Adding a combination here needs no change
# to the workflow unless the list of Python versions itself changes.
[tool.hatch.envs.test]
features = ["dev"]
installer = "uv"
matrix-name-format = "{variable}{value}"

[tool.hatch.envs.test.scripts]
run = "pytest {args}"
cov = "pytest --cov {args}"

# We use three tables, because the rows have different numbers of combinations:
# Wagtail 7.0 requires Django 5.2 or earlier, and does not support Python 3.14,
# Django 6.x requires Python 3.12+. A single table would be more difficult
# to read.
[[tool.hatch.envs.test.matrix]]
python = ["3.10", "3.11"]
django = ["5.2"]
wagtail = ["7.0"]

[[tool.hatch.envs.test.matrix]]
python = ["3.12"]
django = ["6.0"]
wagtail = ["7.4"]

[[tool.hatch.envs.test.matrix]]
python = ["3.13", "3.14"]
django = ["6.1"]
wagtail = ["8.0"]

# The matrix variables above are just labels; these turn them into real pins.
[tool.hatch.envs.test.overrides]
matrix.django.dependencies = [
    { value = "django~=5.2.0", if = ["5.2"] },
    { value = "django~=6.0.0", if = ["6.0"] },
    { value = "django~=6.1.0", if = ["6.1"] },
]
matrix.wagtail.dependencies = [
    { value = "wagtail~=7.0.0", if = ["7.0"] },
    { value = "wagtail~=7.4.0", if = ["7.4"] },
    { value = "wagtail~=8.0.0", if = ["8.0"] },
]

# No pins at all, so this resolves whatever Wagtail / Django / wagtail-localize
# are current. Advisory in CI: a breaking upstream release surfaces here first
# without failing the build.
[tool.hatch.envs.latest]
features = ["dev"]
installer = "uv"
python = "3.13"

[tool.hatch.envs.latest.scripts]
run = "pytest {args}"
cov = "pytest --cov {args}"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "test_settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
pythonpath = ["."]
# Selenium-specific settings
markers = [
    "selenium: marks tests as selenium e2e tests (deselect with '-m \"not selenium\"')",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
