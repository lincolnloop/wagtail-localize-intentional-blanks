name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # Python 3.14 is advisory: it is the newest interpreter and the first place
    # an upstream incompatibility tends to land, so it reports without blocking.
    continue-on-error: ${{ matrix.python-version == '3.14' }}
    strategy:
      fail-fast: false
      matrix:
        # Interpreters only. Which Django/Wagtail combinations each one covers
        # is declared by the hatch matrix in pyproject.toml, which `+py=`
        # filters to this job's interpreter. The support matrix has exactly
        # one home and this list only changes when a Python version does.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      # Pinned to an exact version rather than a floating major: setup-uv
      # publishes no major tag past v7, so tracking its current release means
      # naming the version and bumping it by hand.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          # hatch resolves `py3.X` from the interpreters on PATH, and the
          # activated environment is what puts this job's interpreter there.
          activate-environment: true

      - name: Test
        run: uvx hatch run +py=${{ matrix.python-version }} test:cov

  # Separate from the matrix because this one pins nothing. Instead, it resolves
  # whatever Wagtail, Django, wagtail-localize are current, so a breaking
  # upstream release shows up here before it reaches a release of this package.
  latest:
    name: "latest: unpinned dependencies"
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
          activate-environment: true
      - name: Test
        run: uvx hatch run latest:cov

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format
        run: ruff format --check .
